services:
  - type: web
    name: nexpath
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /app/scripts/start_render_free.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: CHECKPOINT_URL
        sync: false
      - key: HF_TOKEN
        sync: false
